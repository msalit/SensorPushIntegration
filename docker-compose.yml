version: '3.8'

services:
  sensorpush-google-home:
    build: .
    container_name: sensorpush-google-home
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SENSORPUSH_EMAIL=${SENSORPUSH_EMAIL}
      - SENSORPUSH_PASSWORD=${SENSORPUSH_PASSWORD}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-sensorpush-google-home}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
